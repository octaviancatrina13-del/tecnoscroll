name: Actualizar feed de TecnoScroll

on:
  schedule:
    # Cada 8 horas (UTC): 00:00, 08:00 y 16:00. Ajusta si quieres otra frecuencia.
    - cron: '0 */8 * * *'
  workflow_dispatch: # ejecución manual desde la pestaña Actions
    inputs:
      max_articles:
        description: 'Cuántas noticias procesar en ESTA ejecución manual (el cron sigue usando 45)'
        required: false
        default: '45'

concurrency:
  group: tecnoscroll-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pipeline (fetch → reescritura → imagen → publicar)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MAX_ARTICLES_PER_RUN: ${{ github.event.inputs.max_articles || vars.MAX_ARTICLES_PER_RUN || '45' }}
        run: npm run pipeline

      - name: Commit y push de los artículos nuevos
        run: |
          git config user.name "tecnoscroll-bot"
          git config user.email "bot@tecnoscroll.es"
          git add src/content/articles data/processed.json
          if git diff --staged --quiet; then
            echo "Sin artículos nuevos; nada que commitear."
          else
            git commit -m "feed: nuevos artículos ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Integrar cualquier cambio remoto antes de empujar (evita el rechazo
            # 'fetch first' si el repo avanzó mientras corría el pipeline).
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push reintento $i…"; sleep 5
            done
          fi
